name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@2bda8e8e8073a2578db4bbb1e0f6aaf21d061bcd
    with:
      job_name: Smoke & E2E
      node_version: "22"
      runner: ubuntu-24.04
      package_manager: npm
      cache: npm
      cache_dependency_path: package-lock.json
      prepare_command: npx playwright install --with-deps chromium
      test_command: npm run test:e2e
      timeout_minutes: 30
